syntax = "proto3";

package proto;

option go_package = "github.com/dmi3midd/memap/proto/gen/memapv1/go";

enum CommandType {
  UNKNOWN = 0;
  SET = 1;
  GET = 2;
  DEL = 3;
  CREATE_NS = 4;
  DELETE_NS = 5;
  PING = 6;
}

message Request {
  CommandType type = 1;
  string key = 2;
  string value = 3;
  optional string namespace_name = 4;
  optional int64 ttl_seconds = 5;
}

message Response {
  bool success = 1;
  string value = 2;
  string error_message = 3;
}
